apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingFile = rootProject.file('../../keystores/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def signingValue = { name, names -> names.collect { System.getenv(it) }.find { it } ?: signingProperties.getProperty(name) }
def releaseStore = signingValue('storeFile', ['KEYSTORE_FILE', 'ANDROID_KEYSTORE_PATH', 'REATER_KEYSTORE_FILE'])
def releaseStorePassword = signingValue('storePassword', ['KEYSTORE_PASSWORD', 'ANDROID_KEYSTORE_PASSWORD', 'REATER_STORE_PASS'])
def releaseAlias = signingValue('keyAlias', ['KEY_ALIAS', 'ANDROID_KEY_ALIAS', 'REATER_KEY_ALIAS'])
def releaseKeyPassword = signingValue('keyPassword', ['KEY_PASSWORD', 'ANDROID_KEY_PASSWORD', 'REATER_KEY_PASS'])
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } &&
    (!releaseStore || !releaseStorePassword || !releaseAlias || !releaseKeyPassword)) {
    throw new GradleException('Release signing requires environment variables or central keystores/signing.properties')
}


def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def requestedCode = System.getenv('ANDROID_VERSION_CODE') ?: '10102'
if (releaseRequested && (!requestedCode || !(requestedCode ==~ /[1-9][0-9]*/) || requestedCode.toLong() > 2100000000L)) {
    throw new GradleException('Set ANDROID_VERSION_CODE to a positive integer <= 2100000000. Use build-apk.bat for local releases.')
}

android {
    namespace "io.github.jimmyshian.runic"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.jimmyshian.runic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode requestedCode ? requestedCode.toInteger() : 1
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '1.1.2'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStore) storeFile file(releaseStore)
            storePassword releaseStorePassword
            keyAlias releaseAlias
            keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
